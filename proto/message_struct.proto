syntax = "proto3";

message TestMsg {
	uint32 magic = 2;
	uint32 slice_index = 3;
    
    bytes file_id = 1;
    bytes aes_key = 5;
    bytes iv = 6; 
    bytes ciphertext = 7;

    uint32 plaintext_size = 8;
    uint32 total_slices = 4;
    bool is_control = 9;
}

message request_message {
    bytes file_id = 1;
    bytes missing_slices_index_json = 2;
    bytes input_file_path =3 ;
    bytes slice_data_information =4;
    uint32 slice_index = 5;
    bool is_download = 6;
}