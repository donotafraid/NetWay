name: sanitizers

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  # 单独一个 job 构建 open62541，缓存给后续 job 复用
  build-open62541:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 缓存 open62541
        id: cache-o6
        uses: actions/cache@v4
        with:
          path: third_party/open62541-v1.4.14
          key: open62541-v1.4.14-ubuntu22-${{ hashFiles('scripts/build_open62541.sh') }}
      - name: 构建 open62541（缓存未命中时）
        if: steps.cache-o6.outputs.cache-hit != 'true'
        run: bash scripts/build_open62541.sh third_party/open62541-v1.4.14


  asan:
    needs: build-open62541
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: third_party/open62541-v1.4.14
          key: open62541-v1.4.14-ubuntu22-${{ hashFiles('scripts/build_open62541.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.conan
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.*') }}
      - name: 安装 Conan 依赖
        run: |
          pip install "conan>=2,<3"
          conan profile detect --force
          conan install . -of conan_debug_build \
              -s build_type=Debug --build=missing
      - name: 配置 ASan
        run: |
          cmake -B build-asan -DENABLE_ASAN=ON -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
                -DCMAKE_TOOLCHAIN_FILE=conan_debug_build/conan_toolchain.cmake \
                -DOPEN62541_ROOT=${{ github.workspace }}/third_party/open62541-v1.4.14
      - name: 构建 ASan
        run: cmake --build build-asan -j
      - name: 运行 ASan + UBSan
        run: ./scripts/run_asan.sh
      - name: 上传 ASan 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-logs
          path: build-asan/asan_logs/


  lsan:
    needs: build-open62541
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: third_party/open62541-v1.4.14
          key: open62541-v1.4.14-ubuntu22-${{ hashFiles('scripts/build_open62541.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.conan
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.*') }}
      - name: 安装 Conan 依赖
        run: |
          pip install "conan>=2,<3"
          conan profile detect --force
          conan install . -of conan_debug_build \
              -s build_type=Debug --build=missing
      - name: 配置 LSan
        run: |
          cmake -B build-lsan -DENABLE_LSAN=ON -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
                -DCMAKE_TOOLCHAIN_FILE=conan_debug_build/conan_toolchain.cmake \
                -DOPEN62541_ROOT=${{ github.workspace }}/third_party/open62541-v1.4.14
      - name: 构建 LSan
        run: cmake --build build-lsan -j
      - name: 运行 LSan
        run: ./scripts/run_lsan.sh
      - name: 上传 LSan 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsan-logs
          path: build-lsan/lsan_logs/


  tsan:
    needs: build-open62541
    runs-on: ubuntu-22.04
    # TSan 对 ASLR 敏感，setarch -R 已在脚本里；如仍误报，把 runner 换成自托管
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: third_party/open62541-v1.4.14
          key: open62541-v1.4.14-ubuntu22-${{ hashFiles('scripts/build_open62541.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.conan
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.*') }}
      - name: 安装 Conan 依赖
        run: |
          pip install "conan>=2,<3"
          conan profile detect --force
          conan install . -of conan_debug_build \
              -s build_type=Debug --build=missing
      - name: 配置 TSan
        run: |
          cmake -B build-tsan -DENABLE_TSAN=ON -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
                -DCMAKE_TOOLCHAIN_FILE=conan_debug_build/conan_toolchain.cmake \
                -DOPEN62541_ROOT=${{ github.workspace }}/third_party/open62541-v1.4.14
      - name: 构建 TSan
        run: cmake --build build-tsan -j
      - name: 运行 TSan
        run: ./scripts/run_tsan.sh
      - name: 上传 TSan 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-logs
          path: build-tsan/tsan_logs/


  # 可选：非 sanitizer 的功能回归 + 重复 50 次
  flaky:
    needs: build-open62541
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: third_party/open62541-v1.4.14
          key: open62541-v1.4.14-ubuntu22-${{ hashFiles('scripts/build_open62541.sh') }}
      - uses: actions/cache@v4
        with:
          path: ~/.conan
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.*') }}
      - name: 安装 Conan 依赖
        run: |
          pip install "conan>=2,<3"
          conan profile detect --force
          conan install . -of conan_debug_build -s build_type=Debug --build=missing
      - name: 构建 Debug
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
                -DCMAKE_TOOLCHAIN_FILE=conan_debug_build/conan_toolchain.cmake \
                -DOPEN62541_ROOT=${{ github.workspace }}/third_party/open62541-v1.4.14
          cmake --build build -j
      - name: 重复 + 乱序（抖 flaky）
        run: |
          cd build
          ./tests-build/tests \
              --gtest_repeat=50 --gtest_shuffle --gtest_break_on_failure=0
              --gtest_fail_if_no_test_selected