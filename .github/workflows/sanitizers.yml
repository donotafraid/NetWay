name: sanitizers

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  # ============================================================
  # 单独一个 job 构建 open62541，负责保存缓存
  # ============================================================
  build-open62541:
    runs-on: ubuntu-22.04
    env:
      CC: clang-17
      CXX: clang++-17
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Clang 17 与 libc++
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt-get install -y libc++-17-dev libc++abi-17-dev

          clang-17 --version

      - name: 恢复 open62541 缓存
        id: cache-o6
        uses: actions/cache@v4
        with:
          path: third_party/open62541-v1.4.14
          key: open62541-v1.4.14-ubuntu22-clang17-v3-${{ hashFiles('scripts/build_open62541.sh') }}

      - name: 构建 open62541（缓存未命中时）
        if: steps.cache-o6.outputs.cache-hit != 'true'
        run: bash scripts/build_open62541.sh third_party/open62541-v1.4.14

  # ============================================================
  # ASan + UBSan
  # ============================================================
  asan:
    needs: build-open62541
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Clang 17 与 libc++
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt-get install -y libc++-17-dev libc++abi-17-dev
          clang-17 --version

      - name: 恢复 open62541 缓存
        id: cache-o6
        uses: actions/cache/restore@v4
        with:
          path: third_party/open62541-v1.4.14
          key: open62541-v1.4.14-ubuntu22-clang17-v3-${{ hashFiles('scripts/build_open62541.sh') }}

      - name: 构建 open62541（缓存未命中时回退）
        if: steps.cache-o6.outputs.cache-hit != 'true'
        env:
          CC: clang-17
          CXX: clang++-17
        run: bash scripts/build_open62541.sh third_party/open62541-v1.4.14

      - name: 检查 open62541 产物
        run: |
          set -e
          ROOT=${{ github.workspace }}/third_party/open62541-v1.4.14
          test -f "${ROOT}/include/open62541/client_highlevel.h" || { echo "缺 client_highlevel.h"; exit 1; }
          test -f "${ROOT}/build/src_generated/open62541/config.h" || { echo "缺 src_generated"; exit 1; }
          test -f "${ROOT}/build/bin/libopen62541.so" || { echo "缺 libopen62541.so"; exit 1; }
          echo "open62541 就绪"

      - name: 恢复 Conan 缓存
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan2-${{ runner.os }}-clang17-${{ hashFiles('conanfile.*') }}

      - name: 安装 Conan 依赖（Clang 17 + libc++）
        run: |
          pip install "conan>=2,<3"
          mkdir -p ~/.conan2/profiles
          cat > ~/.conan2/profiles/default <<'EOF'
          [settings]
          os=Linux
          arch=x86_64
          build_type=Debug
          compiler=clang
          compiler.version=17
          compiler.cppstd=gnu17
          compiler.libcxx=libc++
          EOF
          conan install . -of conan_debug_build -s build_type=Debug --build=missing

      - name: 配置 ASan
        run: |
          cmake -B build-asan -DENABLE_ASAN=ON -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=clang-17 -DCMAKE_CXX_COMPILER=clang++-17 \
                -DCMAKE_TOOLCHAIN_FILE=conan_debug_build/conan_toolchain.cmake \
                -DOPEN62541_ROOT=${{ github.workspace }}/third_party/open62541-v1.4.14

      - name: 构建 ASan
        run: cmake --build build-asan -j

      - name: 运行 ASan + UBSan
        run: ./scripts/run_asan.sh

      - name: 上传 ASan 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-logs
          path: build-asan/asan_logs/

