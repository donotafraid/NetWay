          test -f "${ROOT}/build/src_generated/open62541/config.h" || { echo "缺 src_generated"; exit 1; }
          test -f "${ROOT}/build/bin/libopen62541.so" || { echo "缺 libopen62541.so"; exit 1; }
          echo "open62541 就绪"

      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-clang17-lsan-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-clang17-lsan-

      - name: 配置 LSan
        run: |
          cmake -B build-lsan -DENABLE_LSAN=ON -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=clang-17 -DCMAKE_CXX_COMPILER=clang++-17 \
                -DCMAKE_TOOLCHAIN_FILE=conan_debug_build/conan_toolchain.cmake \
                -DOPEN62541_ROOT=${{ github.workspace }}/third_party/open62541-v1.4.14 \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: 构建 LSan
        run: cmake --build build-lsan -j

      - name: 清理旧 LSan 日志
        run: rm -rf build-lsan/lsan_logs

      - name: 运行 LSan
        run: ./scripts/run_lsan.sh

      - name: 上传 LSan 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsan-logs-${{ github.sha }}
          path: build-lsan/lsan_logs/

  # ============================================================
  # TSan
  # ============================================================
  tsan:
    needs: build-open62541
