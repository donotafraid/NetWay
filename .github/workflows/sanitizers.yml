          key: conan2-${{ runner.os }}-clang17-${{ hashFiles('conanfile.*') }}
          fail-on-cache-miss: true

      - name: 恢复 conan_debug_build 缓存
        uses: actions/cache/restore@v4
        with:
          path: conan_debug_build
          key: conan-debug-build-${{ runner.os }}-clang17-${{ hashFiles('conanfile.*') }}
          fail-on-cache-miss: true

      - name: 检查 open62541 产物
        run: |
          set -e
          ROOT=${{ github.workspace }}/third_party/open62541-v1.4.14
          test -f "${ROOT}/include/open62541/client_highlevel.h" || { echo "缺 client_highlevel.h"; exit 1; }
          test -f "${ROOT}/build/src_generated/open62541/config.h" || { echo "缺 src_generated"; exit 1; }
          test -f "${ROOT}/build/bin/libopen62541.so" || { echo "缺 libopen62541.so"; exit 1; }
          echo "open62541 就绪"

      - name: 恢复 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-clang17-flaky-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-clang17-flaky-

      - name: 构建 Debug
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=clang-17 -DCMAKE_CXX_COMPILER=clang++-17 \
                -DCMAKE_TOOLCHAIN_FILE=conan_debug_build/conan_toolchain.cmake \
                -DOPEN62541_ROOT=${{ github.workspace }}/third_party/open62541-v1.4.14 \
                -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j

      - name: 重复 + 乱序（抖 flaky）
        run: |
          cd build
          ./tests-build/tests \
              --gtest_repeat=50 --gtest_shuffle --gtest_break_on_failure=0 \
              --gtest_fail_if_no_test_selected