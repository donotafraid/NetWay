          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt-get install -y libc++-17-dev libc++abi-17-dev
          clang-17 --version


      - name: 恢复 open62541 缓存
        id: cache-o6
        uses: actions/cache/restore@v4
        with:
          path: third_party/open62541-v1.4.14
          key: open62541-v1.4.14-ubuntu22-clang17-v3-${{ hashFiles('scripts/build_open62541.sh') }}

      - name: 构建 open62541（缓存未命中时回退）
