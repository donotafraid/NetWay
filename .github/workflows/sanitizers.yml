  # ============================================================
  # 功能回归 + 抖 flaky
  # ============================================================
  flaky:
    needs: build-open62541
    runs-on: ubuntu-22.04
    env:
      CC: clang-17
      CXX: clang++-17
    steps:
      - uses: actions/checkout@v4

      - name: 输出被测 SHA
        run: echo "本次 flaky 测试 SHA: ${{ github.sha }}"

      - name: 安装 Clang 17、libc++、ccache
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 17
          sudo apt-get install -y libc++-17-dev libc++abi-17-dev ccache
          clang-17 --version
          echo "/usr/lib/ccache" >> $GITHUB_PATH

      - name: 恢复 open62541 缓存
        uses: actions/cache/restore@v4
        with:
          path: third_party/open62541-v1.4.14
          key: open62541-${{ env.OPEN62541_VERSION }}-ubuntu22-clang17-${{ hashFiles('scripts/build_open62541.sh') }}
