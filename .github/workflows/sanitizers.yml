          echo "open62541 就绪"

      - name: 恢复 Conan 缓存
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: conan2-${{ runner.os }}-clang17-${{ hashFiles('conanfile.*') }}

      - name: 安装 Conan 依赖（Clang 17 + libc++）
        run: |
          pip install "conan>=2,<3"
          mkdir -p ~/.conan2/profiles
          cat > ~/.conan2/profiles/default <<'EOF'
          [settings]
          os=Linux
          arch=x86_64
          build_type=Debug
          compiler=clang
          compiler.version=17
          compiler.cppstd=gnu17
          compiler.libcxx=libc++
          EOF
          conan install . -of conan_debug_build -s build_type=Debug --build=missing

      - name: 构建 Debug
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_COMPILER=clang-17 -DCMAKE_CXX_COMPILER=clang++-17 \
                -DCMAKE_TOOLCHAIN_FILE=conan_debug_build/conan_toolchain.cmake \
                -DOPEN62541_ROOT=${{ github.workspace }}/third_party/open62541-v1.4.14
          cmake --build build -j

      - name: 重复 + 乱序（抖 flaky）
        run: |
          cd build
          ./tests-build/tests \
              --gtest_repeat=50 --gtest_shuffle --gtest_break_on_failure=0 \
              --gtest_fail_if_no_test_selected