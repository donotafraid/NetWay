  # ============================================================
  # 功能回归 + 抖 flaky
  # ============================================================
  flaky:
    needs: build-open62541
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Clang 17 与 libc++
        run: |
